# Two Franka Panda arms side by side on the near table edge (ALOHA-style), facing +x.
name: franka_bimanual
adapter: xrcollect.embodiment.franka:FrankaAdapter
model: assets/third_party/mujoco_menagerie/franka_emika_panda/panda.xml
arms:                        # one entry per teleoperated end-effector; the key is the arm's name everywhere
  l: {pos: [-0.05, 0.3, 0.75], yaw_deg: 0, wrist_camera: cam_left_wrist, label: Left}
  r: {pos: [-0.05, -0.3, 0.75], yaw_deg: 0, wrist_camera: cam_right_wrist, label: Right}
home_q: [0.0, -0.3, 0.0, -2.2, 0.0, 1.9, 0.785]
max_joint_vel: 2.5           # rad/s, IK and safety filter
gripper: {force: 40, finger_speed: 0.05}   # N squeeze (real Franka Hand: <= 70 N), m/s per finger
workspace: {min: [0.05, -0.65, 0.755], max: [0.95, 0.65, 1.45]}   # TCP target clamp (world)
operator_x: -0.5             # where the operator stands (world x) after recenter
safety:                      # collision-only filter on every joint target (xrcollect/safety.py)
  arm_margin: 0.02           # m between two arms
  link_margin: 0.01          # m between arm links and the table top
  finger_margin: 0.005       # m between the fingers and the table top
